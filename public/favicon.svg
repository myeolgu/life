<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <rect x="0" y="0" width="16" height="16" fill="#b4784a"/>

  <!-- spark above chimney -->
  <rect x="10" y="0" width="1" height="1" fill="#e0524b"/>

  <!-- chimney -->
  <rect x="10" y="1" width="1" height="3" fill="#5b3a24"/>

  <!-- roof (stepped pyramid) -->
  <rect x="7" y="2" width="2" height="1" fill="#5b3a24"/>
  <rect x="6" y="3" width="4" height="1" fill="#5b3a24"/>
  <rect x="5" y="4" width="6" height="1" fill="#5b3a24"/>
  <rect x="4" y="5" width="8" height="1" fill="#5b3a24"/>
  <rect x="3" y="6" width="10" height="1" fill="#5b3a24"/>

  <!-- walls -->
  <rect x="3" y="7" width="10" height="7" fill="#fdf6ec"/>

  <!-- windows -->
  <rect x="5" y="8" width="2" height="2" fill="#3fa796"/>
  <rect x="9" y="8" width="2" height="2" fill="#3fa796"/>

  <!-- door -->
  <rect x="7" y="10" width="2" height="4" fill="#5b3a24"/>
</svg>
